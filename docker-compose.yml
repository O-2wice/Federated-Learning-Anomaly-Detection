# docker-compose.yml
# FLEAD: Federated Learning Edge-IoT & Data pipeline
# SINGLE BROKER MODE

services:
  # -------------------------------------------------
  # 0) DATA PREPROCESSOR (Kaggle + CSV/chunks generator)
  # -------------------------------------------------
  data-preprocessor:
    build:
      context: .
      dockerfile: docker/Dockerfile.data-preprocessor
    container_name: data-preprocessor
    # Not part of the default `docker compose up`: it rewrites data/processed,
    # which would pull the device CSVs out from under the running producer
    # and Spark. START.bat / ./start run it explicitly with
    # `docker compose run --rm data-preprocessor` only when data is missing.
    profiles: ["data"]
    working_dir: /app
    command: >
      bash -lc
      "python scripts/data_preprocessor.py &&
       python scripts/convert_chunks_to_device_csvs.py"
    environment:
      KAGGLE_CONFIG_DIR: /root/.kaggle
    volumes:
      - ./data:/app/data
      - ./kaggle:/root/.kaggle:ro
    networks:
      - flead_network
    restart: "no"

  # -------------------------------------------------
  # 0b) JUPYTER DEV UI (optional, for inspecting notebooks)
  # -------------------------------------------------
  jupyter-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter-dev
    container_name: jupyter-dev
    working_dir: /app
    volumes:
      - .:/app
      - ./kaggle:/root/.kaggle:ro
    environment:
      KAGGLE_CONFIG_DIR: /root/.kaggle
    ports:
      - "8888:8888"
    networks:
      - flead_network
    restart: "no"

  # -------------------------------------------------
  # 1) KAFKA SINGLE BROKER (KRaft mode)
  # -------------------------------------------------
  kafka-broker-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-broker-1
    ports:
      - "9092:9092"    # client port (the only data listener; 29093 is the internal KRaft controller)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_HEAP_OPTS: "-Xmx600M -Xms600M"

      # REQUIRED by Confluent KRaft entrypoint
      CLUSTER_ID: "DrFOBqf2SYmi0Qu1eq13kw"

      # KRaft quorum (single node)
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-broker-1:29093"

      # Listeners: data + controller
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-broker-1:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # Internal topics & group coordination
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # The producer can publish before the orchestrator creates the topics;
      # auto-created topics then get the same 4 partitions instead of 1
      KAFKA_NUM_PARTITIONS: 4
      # JMX for Kafka UI's throughput and size figures. The image's launch
      # script passes the port only to the broker process, so kafka-topics in
      # the healthcheck and topic setup does not try to bind it.
      KAFKA_JMX_PORT: 9997
      KAFKA_JMX_HOSTNAME: kafka-broker-1

      # Data dir
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - kafka_broker_1_data:/var/lib/kafka/data
    networks:
      - flead_network
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      # kafka-topics starts a full JVM; under pipeline load it regularly took
      # >10s, so the broker flapped to "unhealthy" while working normally.
      timeout: 30s
      retries: 10
      start_period: 180s

  # -------------------------------------------------
  # 2) TIMESCALEDB + INIT
  # -------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:2.15.1-pg14
    container_name: timescaledb
    environment:
      # Local-demo defaults; override in a .env file (see .env.example)
      POSTGRES_DB: "${POSTGRES_DB:-flead}"
      POSTGRES_USER: "${POSTGRES_USER:-flead}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - flead_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  database-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.database-init
    container_name: database-init
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: "${POSTGRES_DB:-flead}"
      DB_USER: "${POSTGRES_USER:-flead}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-password}"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - flead_network
    restart: "no"

  timescaledb-collector:
    build:
      context: .
      dockerfile: docker/Dockerfile.timescaledb-collector
    container_name: timescaledb-collector
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: "${POSTGRES_DB:-flead}"
      DB_USER: "${POSTGRES_USER:-flead}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-broker-1:9092"
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      # database-init drops and recreates the tables; starting before it
      # finishes loses the first inserts
      database-init:
        condition: service_completed_successfully
      kafka-broker-1:
        condition: service_started
    networks:
      - flead_network
    restart: unless-stopped


  # -------------------------------------------------
  # 3) FLINK CLUSTER
  # -------------------------------------------------
  flink-jobmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile.flink
    container_name: flink-jobmanager
    command: jobmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      JOB_MANAGER_RPC_PORT: 6123
      TASK_MANAGER_RPC_PORT: 6122
      TASK_MANAGER_MEMORY_PROCESS_SIZE: 1024m
      JOB_MANAGER_MEMORY_PROCESS_SIZE: 1024m
      KAFKA_BOOTSTRAP_SERVERS: "kafka-broker-1:9092"
      LOCAL_MODEL_DIR: "/opt/flink/models/local"
      FLINK_PROPERTIES: |
        akka.ask.timeout: 60s
        akka.tcp.timeout: 60s
        akka.startup-timeout: 60s
        web.timeout: 60000
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    ports:
      - "6123:6123"
      - "8161:8081"       # Flink dashboard
    volumes:
      - flink_jobmanager_data:/flink/data
      # Latest FedAvg global model (written by federated-aggregator)
      - models_global:/opt/flink/models/global:ro
      - ./scripts:/opt/flink/scripts
      - ./data:/opt/flink/data:ro
      - ./flink-jars:/opt/flink/usrlib
    networks:
      - flead_network
    depends_on:
      kafka-broker-1:
        condition: service_started

  flink-taskmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile.flink
    container_name: flink-taskmanager
    command: taskmanager
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      KAFKA_BOOTSTRAP_SERVERS: "kafka-broker-1:9092"
      LOCAL_MODEL_DIR: "/opt/flink/models/local"
      FLINK_PARALLELISM: "2"
      FLINK_PROPERTIES: |
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        taskmanager.memory.process.size: 1024m
        akka.ask.timeout: 60s
        akka.tcp.timeout: 60s
        akka.startup-timeout: 60s
        web.timeout: 60000
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ./flink-jars:/opt/flink/usrlib
      # Local training rounds start from the latest FedAvg global model
      - models_global:/opt/flink/models/global:ro
    depends_on:
      flink-jobmanager:
        condition: service_started
    networks:
      - flead_network


  # -------------------------------------------------
  # 4) SPARK CLUSTER
  # -------------------------------------------------
  spark-master:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_NO_DAEMONIZE: "1"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      # Web UI ports equal the host ports and SPARK_PUBLIC_DNS makes the UIs
      # link to localhost; otherwise the application, worker and log links
      # point at container addresses the browser cannot reach
      SPARK_MASTER_WEBUI_PORT: 8086
      SPARK_PUBLIC_DNS: localhost
      # The analytics driver runs in this container (spark-submit client mode)
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: "${POSTGRES_DB:-flead}"
      DB_USER: "${POSTGRES_USER:-flead}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      STREAM_ROWS_PER_DEVICE: "${STREAM_ROWS_PER_DEVICE:-660}"
      # Enables /metrics/master/prometheus for the Prometheus scrape job
      SPARK_MASTER_OPTS: >-
        -Dspark.metrics.conf.*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
        -Dspark.metrics.conf.*.sink.prometheusServlet.path=/metrics/prometheus
        -Dspark.metrics.conf.master.sink.prometheusServlet.path=/metrics/master/prometheus
    ports:
      - "8086:8086"
      - "7077:7077"
      - "4040:4040"     # UI of the running analytics job (its driver runs here)
    volumes:
      - spark_master_data:/opt/spark/work
      - ./scripts:/opt/spark/scripts
      - ./data:/opt/spark/data:ro
      - models_global:/app/models/global
    networks:
      - flead_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/json/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      kafka-broker-1:
        condition: service_started
      timescaledb:
        condition: service_healthy

  spark-worker-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "1"
      SPARK_WORKER_WEBUI_PORT: 8087
      SPARK_PUBLIC_DNS: localhost
    volumes:
      - spark_worker_data:/opt/spark/work
      # Executors run here, so the worker needs the same data and scripts
      # paths as spark-master; without this, batch analysis fails with
      # "File file:/opt/spark/data/processed/device_N.csv does not exist".
      - ./data:/opt/spark/data:ro
      - ./scripts:/opt/spark/scripts
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - flead_network
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/json/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # -------------------------------------------------
  # 5) KAFKA UI
  # -------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: flead
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-broker-1:9092"
      # Without broker metrics the dashboard shows 0 bytes produced and consumed
      KAFKA_CLUSTERS_0_METRICS_PORT: 9997
      KAFKA_CLUSTERS_0_METRICS_TYPE: JMX
    depends_on:
      kafka-broker-1:
        condition: service_started
    networks:
      - flead_network

  # -------------------------------------------------
  # 6) KAFKA PRODUCER
  # -------------------------------------------------
  kafka-producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.producer
    container_name: kafka-producer
    command: [
      "python", "scripts/02_kafka_producer.py",
      "--source", "data/processed",
      # 2,400 devices share this rate round-robin. At 10 msg/s each device
      # got one reading every ~4 min, so the per-device RCF never warmed up
      # (0 anomalies) and local models trained on 1-2 samples.
      "--rate", "150",
      "--topic", "edge-iiot-stream"
    ]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-broker-1:9092"
      STREAM_ROWS_PER_DEVICE: "${STREAM_ROWS_PER_DEVICE:-660}"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      kafka-broker-1:
        condition: service_started
    networks:
      - flead_network
    restart: unless-stopped


  # -------------------------------------------------
  # 7) FEDERATED AGGREGATION SERVICE
  # -------------------------------------------------
  federated-aggregator:
    build:
      context: .
      dockerfile: docker/Dockerfile.aggregator
    container_name: federated-aggregator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-broker-1:9092"
      # config_loader reads DB_*; the previous TIMESCALEDB_* names were ignored
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: "${POSTGRES_DB:-flead}"
      DB_USER: "${POSTGRES_USER:-flead}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-password}"
    volumes:
      - models_global:/app/models/global
    depends_on:
      kafka-broker-1:
        condition: service_started
      timescaledb:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    networks:
      - flead_network
    restart: unless-stopped
    healthcheck:
      # Kafka is a separate container; inside the aggregator "localhost:9092"
      # is never listening, so this check used to report unhealthy forever.
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('kafka-broker-1', 9092)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # -------------------------------------------------
  # 7b) DASHBOARD METRICS UPDATER (KPI snapshots for Grafana)
  # Not Spark: the Spark analytics job is submitted to spark-master by
  # scripts/pipeline_orchestrator.py. This service only writes KPI rows to
  # dashboard_metrics every 15 s.
  # -------------------------------------------------
  dashboard-metrics-updater:
    build:
      context: .
      dockerfile: docker/Dockerfile.aggregator
    container_name: dashboard-metrics-updater
    command: ["python", "scripts/dashboard_metrics_updater.py"]
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: "${POSTGRES_DB:-flead}"
      DB_USER: "${POSTGRES_USER:-flead}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-password}"
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
      federated-aggregator:
        condition: service_started
    networks:
      - flead_network
    restart: unless-stopped


  # -------------------------------------------------
  # 8) DEVICE VIEWER (FLASK APP)
  # -------------------------------------------------
  device-viewer:
    build:
      context: .
      dockerfile: docker/Dockerfile.device-viewer
    container_name: device-viewer
    ports:
      - "8082:5000"
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: "${POSTGRES_DB:-flead}"
      DB_USER: "${POSTGRES_USER:-flead}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      STREAM_ROWS_PER_DEVICE: "${STREAM_ROWS_PER_DEVICE:-660}"
      PORT: 5000
    volumes:
      - ./data:/app/data:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - flead_network
    restart: unless-stopped

  # -------------------------------------------------
  # 9) MONITORING DASHBOARD (FLASK)
  # -------------------------------------------------
  monitoring-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitoring-dashboard
    container_name: monitoring-dashboard
    ports:
      - "5001:5000"
    environment:
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: "${POSTGRES_DB:-flead}"
      DB_USER: "${POSTGRES_USER:-flead}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka-broker-1:9092"
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka-broker-1:
        condition: service_started
    networks:
      - flead_network
    restart: unless-stopped

  # -------------------------------------------------
  # 10) GRAFANA + INIT
  # -------------------------------------------------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flead_home.json
      # Interpolated into grafana/provisioning/datasources/default.yaml
      DB_NAME: "${POSTGRES_DB:-flead}"
      DB_USER: "${POSTGRES_USER:-flead}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-password}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - flead_network

  grafana-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.grafana-init
    container_name: grafana-init
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GRAFANA_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: "${POSTGRES_DB:-flead}"
      DB_USER: "${POSTGRES_USER:-flead}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:-password}"
    volumes:
      - ./grafana/dashboards:/app/dashboards:ro
      - ./scripts/06_setup_grafana.py:/app/scripts/06_setup_grafana.py:ro
    depends_on:
      grafana:
        condition: service_started
      database-init:
        condition: service_completed_successfully
    networks:
      - flead_network
    restart: "no"

  # -------------------------------------------------
  # 11) PROMETHEUS (Metrics Collection)
  # -------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - flead_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -------------------------------------------------
  # 12) ALERTMANAGER (Alert Notifications)
  # -------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - flead_network
    restart: unless-stopped

# ---------------------------------------------------
# Networks & volumes
# ---------------------------------------------------
networks:
  flead_network:
    driver: bridge

volumes:
  kafka_broker_1_data:
  timescaledb_data:
  flink_jobmanager_data:
  flink_taskmanager_data:
  spark_master_data:
  spark_worker_data:
  grafana_data:
  models_global:
  prometheus_data:
