apiVersion: 1

# Recreate the TimescaleDB data source on every start so it always has the fixed
# uid below. It used to get a generated uid, and panels that referenced
# "timescaledb" or "FLEAD-TimescaleDB" by uid showed "No data".
deleteDatasources:
  - name: FLEAD-TimescaleDB
    orgId: 1

datasources:
  - name: FLEAD-TimescaleDB
    uid: flead-timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    # Grafana expands these from the container environment (docker-compose.yml)
    database: ${DB_NAME}
    user: ${DB_USER}
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1400
      timescaledb: true
    isDefault: true
    editable: true

  # Flink, Spark and pipeline metrics and alert states scraped by Prometheus
  - name: FLEAD-Prometheus
    uid: flead-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 15s
    editable: true
