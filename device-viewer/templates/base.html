<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Devices{% endblock %} · FLEAD Device Viewer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M7 21l5-7 5 5 8-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
        (function () {
            let theme = null;
            try { theme = localStorage.getItem("flead-theme"); } catch (e) {}
            if (!theme) theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <nav class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="{{ url_for('index') }}">FLEAD <span>Device Viewer</span></a>
            <div class="nav-links">
                <a href="{{ url_for('index') }}">Devices</a>
                <a href="{{ monitor_url }}" target="_blank" rel="noopener">Monitor</a>
                <a href="{{ grafana_url }}/d/flead-device" target="_blank" rel="noopener">Grafana</a>
                <button type="button" class="ghost" id="theme">Dark mode</button>
            </div>
        </div>
    </nav>

    <main class="container">{% block content %}{% endblock %}</main>

    <footer class="container footer">
        Device files from <code>data/processed</code> · pipeline results from TimescaleDB ·
        the first {{ stream_rows }} readings of each device are streamed, the rest are held out for evaluation.
    </footer>

    <script>
        const themeButton = document.getElementById("theme");
        const sync = () => themeButton.textContent = document.documentElement.dataset.theme === "dark" ? "Light mode" : "Dark mode";
        themeButton.addEventListener("click", () => {
            const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem("flead-theme", next); } catch (e) {}
            sync();
        });
        sync();
    </script>
</body>
</html>
